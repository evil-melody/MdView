<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>GenOffice PPTX Render Spike</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; background:#141414; color:#ddd; font:14px/1.5 -apple-system,"PingFang SC",sans-serif; }
  #drop { max-width:1000px; margin:0 auto; border:2px dashed #444; border-radius:12px; padding:32px; text-align:center; }
  #drop.over { border-color:#7c6cf0; background:#1c1a2a; }
  #app { max-width:1000px; margin:16px auto; }
  .status { color:#9a9a9a; font-size:13px; }
  .slide { margin:24px 0; }
  .tag { color:#888; font-size:12px; margin-bottom:4px; }
  .canvas { border:1px solid #333; border-radius:4px; overflow:hidden; line-height:0; }
  .canvas > svg { width:100%; height:auto; display:block; background:#fff; }
  .hidden-slide { opacity:.4; }
  input[type=file] { color:#ddd; }
  .status { margin:0 0 12px; }
  button.more { display:block; margin:20px auto; padding:8px 16px; background:#2a2a2a; color:#ddd; border:1px solid #444; border-radius:6px; cursor:pointer; }
  button.more:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div id="drop">
  <p><b>GenOffice pptx-engine + pptx-render 渲染验证</b>（SVG emitter spike）</p>
  <p>拖入 .pptx 文件，或 <input type="file" id="picker" accept=".pptx"/></p>
</div>
<div id="app"></div>
<script></script>
<script src="./spike.js"></script>
</body>
</html>
