<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MdView — 本地文件与 Markdown 一体化工作台</title>
  <desc id="hero-desc">MdView：Tauri 2 桌面应用，支持 Markdown 预览、编辑与脑图，Word/Excel 原生编辑，PDF 与图片预览，远程 AI 流式助手。</desc>

  <defs>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#9B7FFF"/>
    </linearGradient>
    <clipPath id="winClip"><rect x="640" y="48" width="496" height="244" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="24" fill="#141419"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#2E2E3A"/>

  <!-- ===== 左：标题区 ===== -->
  <g transform="translate(64 56)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9B7FFF" letter-spacing="3">TAURI 2 · VUE 3 · RUST</text>

    <text x="-2" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="86" font-weight="800" fill="#ECEAF2">Md<tspan fill="url(#accGrad)">View</tspan></text>

    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="600" fill="#ECEAF2">本地文件与 Markdown 一体化工作台</text>

    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#A8A6B8">预览 · 编辑 · 脑图 · Office 原生编辑 · AI 流式助手，离线优先</text>

    <!-- 文件类型 chips（motif：文件类型色点） -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" fill="#C9C7D6">
      <g transform="translate(0 212)">
        <rect width="112" height="38" rx="19" fill="#1C1C24" stroke="#2E2E3A"/>
        <circle cx="22" cy="19" r="6" fill="#7C5CFF"/>
        <text x="36" y="25">Markdown</text>
      </g>
      <g transform="translate(122 212)">
        <rect width="78" height="38" rx="19" fill="#1C1C24" stroke="#2E2E3A"/>
        <circle cx="22" cy="19" r="6" fill="#E0432D"/>
        <text x="36" y="25">Word</text>
      </g>
      <g transform="translate(210 212)">
        <rect width="78" height="38" rx="19" fill="#1C1C24" stroke="#2E2E3A"/>
        <circle cx="22" cy="19" r="6" fill="#1F9D55"/>
        <text x="36" y="25">Excel</text>
      </g>
      <g transform="translate(298 212)">
        <rect width="68" height="38" rx="19" fill="#1C1C24" stroke="#2E2E3A"/>
        <circle cx="22" cy="19" r="6" fill="#F2701D"/>
        <text x="36" y="25">PPT</text>
      </g>
      <g transform="translate(376 212)">
        <rect width="64" height="38" rx="19" fill="#1C1C24" stroke="#2E2E3A"/>
        <circle cx="22" cy="19" r="6" fill="#E5534B"/>
        <text x="36" y="25">PDF</text>
      </g>
      <g transform="translate(450 212)">
        <rect width="112" height="38" rx="19" fill="rgba(124,92,255,0.16)" stroke="rgba(124,92,255,0.5)"/>
        <text x="20" y="25" fill="#9B7FFF">✨ AI 流式</text>
      </g>
    </g>
  </g>

  <!-- ===== 右：应用窗口 mockup（预览 / 编辑 / 脑图 页签） ===== -->
  <g>
    <rect x="640" y="48" width="496" height="244" rx="14" fill="#1C1C24" stroke="#2E2E3A"/>
    <g clip-path="url(#winClip)">
      <!-- 标题栏 -->
      <circle cx="664" cy="70" r="5" fill="#E5534B"/>
      <circle cx="682" cy="70" r="5" fill="#E8A13C"/>
      <circle cx="700" cy="70" r="5" fill="#3FBF6B"/>
      <rect x="726" y="62" width="180" height="16" rx="8" fill="#24242E"/>
      <line x1="640" y1="86" x2="1136" y2="86" stroke="#2E2E3A"/>

      <!-- 侧栏 -->
      <rect x="640" y="86" width="132" height="206" fill="#17171D"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#A8A6B8">
        <rect x="650" y="100" width="112" height="24" rx="6" fill="#24242E"/>
        <circle cx="662" cy="112" r="5" fill="#7C5CFF"/><text x="674" y="117">Markdown</text>
        <circle cx="662" cy="146" r="5" fill="#E0432D"/><text x="674" y="151">文档</text>
        <circle cx="662" cy="172" r="5" fill="#1F9D55"/><text x="674" y="177">表格</text>
        <circle cx="662" cy="198" r="5" fill="#F2701D"/><text x="674" y="203">演示</text>
        <circle cx="662" cy="224" r="5" fill="#E5534B"/><text x="674" y="229">PDF</text>
        <circle cx="662" cy="250" r="5" fill="#5AA9FF"/><text x="674" y="255">图片</text>
      </g>

      <!-- 页签条：预览 / 编辑 / 脑图 -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">
        <rect x="788" y="98" width="66" height="28" rx="7" fill="rgba(124,92,255,0.16)"/>
        <text x="806" y="117" fill="#9B7FFF" font-weight="600">预览</text>
        <text x="878" y="117" fill="#6F6D80">编辑</text>
        <text x="950" y="117" fill="#6F6D80">脑图</text>
        <line x1="788" y1="132" x2="854" y2="132" stroke="#7C5CFF" stroke-width="2"/>
      </g>

      <!-- 文档内容示意 -->
      <g>
        <rect x="788" y="150" width="150" height="12" rx="4" fill="#ECEAF2"/>
        <rect x="788" y="172" width="284" height="7" rx="3.5" fill="#4A4858"/>
        <rect x="788" y="186" width="260" height="7" rx="3.5" fill="#4A4858"/>
        <!-- 代码块 -->
        <rect x="788" y="204" width="200" height="36" rx="6" fill="#20202A"/>
        <rect x="798" y="214" width="96" height="6" rx="3" fill="#7C5CFF"/>
        <rect x="798" y="226" width="130" height="6" rx="3" fill="#4A4858"/>
        <!-- mermaid 流程示意 -->
        <g stroke="#5AA9FF" fill="none">
          <rect x="1006" y="204" width="58" height="26" rx="5" fill="rgba(90,169,255,0.14)"/>
          <rect x="1006" y="240" width="58" height="26" rx="5" fill="rgba(90,169,255,0.14)"/>
          <line x1="1035" y1="230" x2="1035" y2="240"/>
        </g>
        <rect x="788" y="256" width="284" height="7" rx="3.5" fill="#4A4858"/>
        <rect x="788" y="270" width="212" height="7" rx="3.5" fill="#4A4858"/>
      </g>
    </g>
  </g>
</svg>
